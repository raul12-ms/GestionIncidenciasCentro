spring.application.name=GestionIncidenciasCentro

#Configuración de MySQL. Si fuera MariaDB sería jdbc:mariadb://localhost:3306/incidencias-centro
spring.datasource.url=jdbc:mysql://localhost:3306/incidencias-centro?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuración de JPA (create - update - validate - none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Para ver las SQL que se ejecutan poner las siguientes (opcional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave fija para firmar y validar JWT (usar al menos 32 caracteres)
# Mantener el mismo valor evita que los tokens pierdan validez al reiniciar
jwt.secret=${JWT_SECRET:MatriculasSpringClaveFijaParaDesarrollo2026!}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}